<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateDiscipline</title>
    <link rel="stylesheet" href="/CSS/styleS.css">
    <script src="/JavaScript/script.js"></script>
</head>
<body>
    <h1>Criar Disciplina</h1>
    <hr>
    <div class="form-container">
        <div class="form-group">
            <label for="nome"><em>Nome:</em></label>
            <input type="text" id="nome" placeholder="Digite o nome da disciplina">
        </div>
        <div class="form-group">
            <label for="codigo"><em>Código:</em></label>
            <input type="text" id="codigo" placeholder="Digite o código da disciplina">
        </div>
        <div class="form-group">
            <label for="professor"><em>Professor:</em></label>
            <input type="text" id="professor" placeholder="Digite o nome do professor">
        </div>
        <br>
        <input type="button" class="btn-salvar" value="Salvar" onclick="validarCadastro()">
    </div>
    

</body>
</html>
