<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateStudent</title>
    <link rel="stylesheet" href="/CSS/styleS.css">
    <script src="/JavaScript/script.js"></script>
</head>
<body>
    <h1>Criar Estudante</h1>
    <hr>
    <div class="form-container">
        <img src="FotoPerfil.png" alt="Foto de Perfil" class="profile-img">
        <div class="form-group">
            <label for="nome"><em>Nome:</em></label>
            <input type="text" id="nome" placeholder="Digite seu nome:">
        </div>
        <div class="form-group">
            <label for="matricula"><em>Matrícula:</em></label>
            <input type="password" id="matricula" placeholder="Digite sua matrícula:">
        </div>
        <br>
        <input type="button" class="btn-salvar" value="Salvar" onclick="validarCadastroEstudante()">
    </div>
    

</body>
</html>
